@let currentStep = currentStep$ | async;
@let destination = destination$ | async;

@if (currentStep) {
  <div class="mb-10">
    <app-delivery-point>
      <b class="text-lg font-medium text-gray-800 mb-4 pb-3 border-b border-gray-100 block">
        {{ 'booking.destination.deliveryPoint.title' | transloco }}
      </b>
    </app-delivery-point>
  </div>

  <div class="mb-16">
    <app-delivery-details />
  </div>

  <app-recipient
    [data]="destination?.recipient || null"
    (dataChange)="updateRecipient($event)"
    (validationChange)="onRecipientValidationChange($event)"
  />
}
