@let vm = vm$ | async;
@let isMainLayout = isMainLayout$ | async;

@if (vm && isMainLayout) {
  <app-stepper [steps]="vm.steps" />
}
<router-outlet />
@if (vm && isMainLayout) {
  <div class="flex gap-2 mt-10">
    <button type="button" tuiButton (click)="goPrevStep(vm.prevStep)" [disabled]="!vm.prevStep">
      Назад
    </button>
    @if (vm.isLastStep) {
      <button type="button" tuiButton [disabled]="!vm.stepsValid" (click)="submitOrder()">
        Оформить заказ
      </button>
    } @else {
      <button type="button" tuiButton [disabled]="!vm.nextStep" (click)="goNextStep(vm.nextStep)">
        Дальше
      </button>
    }
  </div>
}
