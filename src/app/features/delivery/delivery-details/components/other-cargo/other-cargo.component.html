<div>
  <tui-select
    [formControl]="item"
    [stringify]="'name' | tuiStringify"
    [tuiTextfieldLabelOutside]="true"
    class="select"
  >
    Выберите запчасть
    <tui-data-list-wrapper
      *tuiDataList
      [items]="options"
      [itemContent]="'name' | tuiStringify | tuiStringifyContent"
    />
  </tui-select>

  @if (item.value) {
    <label tuiLabel>
      Количество мест

      <tui-textfield>
        <input
          tuiInputNumber
          placeholder="0"
          [formControl]="quantity"
          (blur)="setMinQuantityOnBlur()"
          [step]="1"
        />
      </tui-textfield>
    </label>
  }

  <!--  @if (form.controls.item.value) {-->

  <!--      Пожалуйста, выберите тип запчасти из списка. Если вы не нашли подходящую запчасть, рассчитайте стоимость обычной посылки-->
  <!--    </div>-->
  <!--  }-->
</div>
