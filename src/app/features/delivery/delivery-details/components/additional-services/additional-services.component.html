<div class="py-6 px-4 rounded-lg border border-gray-200">
  <h2 class="text-lg font-semibold mb-5 flex items-center text-gray-800">
    {{ 'deliveryDetails.additionalServices.title' | transloco }}
  </h2>

  <div class="space-y-4">
    <div class="group">
      <label
        class="flex items-start cursor-pointer p-2 -mx-2 rounded-md hover:bg-gray-50 transition-all"
      >
        <div class="flex-shrink-0 mt-0.5">
          <input tuiCheckbox type="checkbox" [formControl]="insurance.controls.enabled" size="m" />
        </div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-800">
            {{ 'deliveryDetails.additionalServices.types.insurance' | transloco }}
          </div>
          <div class="text-sm text-gray-500 mt-0.5 group-hover:text-gray-700">
            {{ 'deliveryDetails.additionalServices.messages.insurance' | transloco }}
          </div>

          @if (insurance.controls.enabled.value) {
            <div class="mt-3 pt-3 border-t border-gray-100">
              <span class="text-xs text-gray-500 uppercase tracking-wide">
                {{ 'deliveryDetails.additionalServices.labels.insurance' | transloco }}
              </span>
              <tui-textfield class="max-w-xs mt-1">
                <input
                  tuiInputNumber
                  tuiHintAppearance="error"
                  [formControl]="insurance.controls.amount"
                  [tuiHint]="[] | tuiFieldErrorContent"
                  [min]="INSURANCE_MIN_AMOUNT"
                  [max]="INSURANCE_MAX_AMOUNT"
                />
              </tui-textfield>
            </div>
          }
        </div>
      </label>
    </div>

    <div class="pt-3 border-t border-gray-100 group">
      <label
        class="flex items-start cursor-pointer p-2 -mx-2 rounded-md hover:bg-gray-50 transition-all"
      >
        <div class="flex-shrink-0 mt-0.5">
          <input
            tuiCheckbox
            type="checkbox"
            [formControl]="extendedSms.controls.enabled"
            size="m"
          />
        </div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-800">
            {{ 'deliveryDetails.additionalServices.types.extendedSms' | transloco }}
          </div>
          <div class="text-sm text-gray-500 mt-0.5 group-hover:text-gray-700">
            {{ 'deliveryDetails.additionalServices.messages.extendedSms' | transloco }}
          </div>

          @if (extendedSms.controls.enabled.value) {
            <div class="mt-3 pt-3 border-t border-gray-100">
              <span class="text-xs text-gray-500 uppercase tracking-wide">
                {{ 'deliveryDetails.additionalServices.labels.extendedSms' | transloco }}
              </span>
              <tui-input-phone
                tuiHintAppearance="error"
                [tuiHint]="[] | tuiFieldErrorContent"
                [formControl]="extendedSms.controls.phone"
                class="max-w-xs mt-1"
              />
            </div>
          }
        </div>
      </label>
    </div>

    <div class="pt-3 border-t border-gray-100 group">
      <label
        class="flex items-start cursor-pointer p-2 -mx-2 rounded-md hover:bg-gray-50 transition-all"
      >
        <div class="flex-shrink-0 mt-0.5">
          <input tuiCheckbox type="checkbox" [formControl]="senderSms.controls.enabled" size="m" />
        </div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-800">
            {{ 'deliveryDetails.additionalServices.types.senderSms' | transloco }}
          </div>
          <div class="text-sm text-gray-500 mt-0.5 group-hover:text-gray-700">
            {{ 'deliveryDetails.additionalServices.messages.senderSms' | transloco }}
          </div>

          @if (senderSms.controls.enabled.value) {
            <div class="mt-3 pt-3 border-t border-gray-100">
              <span class="text-xs text-gray-500 uppercase tracking-wide">
                {{ 'deliveryDetails.additionalServices.labels.senderSms' | transloco }}
              </span>
              <tui-input-phone
                tuiHintAppearance="error"
                [tuiHint]="[] | tuiFieldErrorContent"
                [formControl]="senderSms.controls.phone"
                class="max-w-xs mt-1"
              />
            </div>
          }
        </div>
      </label>
    </div>

    <div class="pt-3 border-t border-gray-100 group">
      <label
        class="flex items-start cursor-pointer p-2 -mx-2 rounded-md hover:bg-gray-50 transition-all"
      >
        <div class="flex-shrink-0 mt-0.5">
          <input
            tuiCheckbox
            type="checkbox"
            [formControl]="recipientPayment.controls.enabled"
            size="m"
          />
        </div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-800">
            {{ 'deliveryDetails.additionalServices.types.recipientPayment' | transloco }}
          </div>
          <div class="text-sm text-gray-500 mt-0.5 group-hover:text-gray-700">
            {{ 'deliveryDetails.additionalServices.messages.recipientPayment' | transloco }}
          </div>
        </div>
      </label>
    </div>
  </div>
</div>
