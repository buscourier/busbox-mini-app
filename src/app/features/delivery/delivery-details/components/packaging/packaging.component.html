<div>
  <div>
    <h3>Коробка:</h3>
    @for (box of boxes; track box.id) {
      <label [class.selected]="isSelected(box.id)">
        <input type="checkbox" [checked]="isSelected(box.id)" (click)="selectPackagingItem(box)" />
        <span>{{ box.site_name }}</span>
        <span>{{ +box.price * getQuantity(box.id) }} руб. за {{ getQuantity(box.id) }} шт.</span>

        @if (isSelected(box.id)) {
          <button type="button" (click)="removePackagingItem(box.id)">x</button>
        }
      </label>
    }
  </div>
  <div>
    <h3>Сейф-пакет:</h3>
    @for (pack of safePacks; track pack.id) {
      <label [class.selected]="isSelected(pack.id)">
        <input
          type="checkbox"
          [checked]="isSelected(pack.id)"
          (click)="selectPackagingItem(pack)"
        />
        <span>{{ pack.site_name }}</span>
        <span>{{ +pack.price * getQuantity(pack.id) }} руб. за {{ getQuantity(pack.id) }} шт.</span>

        @if (isSelected(pack.id)) {
          <button type="button" (click)="removePackagingItem(pack.id)">x</button>
        }
      </label>
    }
  </div>

    <h3>Пленка:</h3>

  </div>

        }
      </label>
    }
  </div>
</div>
