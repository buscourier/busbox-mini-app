<div [formGroup]="form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  <div tuiLabel class="relative">
    <div class="flex justify-between mb-1">
      <span class="text-sm text-gray-600 flex items-center">
        <!--         <tui-icon-->
        <!--           icon="@tui.hash"-->
        <!--           class="mr-2"-->
        <!--           [style.color]="'var(&#45;&#45;tui-background-accent-1)'"-->
        <!--           [style.font-size.rem]="1"-->
        <!--         />-->
        Кол-во мест
      </span>
      @if (quantityInput.focused()) {
        <app-limit-badge [value]="getAvailableQuantity()" hintText="Доступно" size="s" />
      }
    </div>

    <tui-textfield #quantityInput class="w-full">
      <input
        tuiInputNumber
        [formControl]="quantity"
        [min]="limits.QUANTITY.MIN"
        [max]="limits.QUANTITY.MAX"
        [tuiHint]="[] | tuiFieldErrorContent"
        [invalid]="quantity.invalid || totalQuantityMaxError"
        (blur)="setMinValueOnBlur(quantity.value, 'quantity')"
        placeholder="0"
        tuiHintAppearance="error"
      />
    </tui-textfield>
  </div>

  <div tuiLabel class="relative">
    <div class="flex justify-between mb-1">
      <span class="text-sm text-gray-600 flex items-center">
        <!--        <tui-icon-->
        <!--          icon="@tui.weight"-->
        <!--          class="mr-2"-->
        <!--          [style.color]="'var(&#45;&#45;tui-background-accent-1)'"-->
        <!--          [style.font-size.rem]="1"-->
        <!--        />-->
        Вес
      </span>
      @if (weightInput.focused()) {
        <app-limit-badge [value]="getAvailableWeight()" units="кг." hintText="Доступно" size="s" />
      }
    </div>

    <tui-textfield #weightInput class="w-full">
      <input
        tuiInputNumber
        [formControl]="weight"
        [min]="limits.WEIGHT.MIN"
        [max]="limits.WEIGHT.MAX"
        [tuiHint]="[] | tuiFieldErrorContent"
        [invalid]="weight.invalid || totalWeightMaxError"
        (blur)="setMinValueOnBlur(weight.value, 'weight')"
        tuiHintAppearance="error"
        postfix=" кг"
      />
    </tui-textfield>
  </div>

  <div class="col-span-full">
    <div class="rounded-md border border-gray-100 p-3 bg-gray-50">
      <div class="flex justify-between mb-3">
        <span class="text-sm text-gray-600 flex items-center">
          <tui-icon
            icon="@tui.proportions"
            class="mr-2"
            [style.color]="'var(--tui-background-accent-1)'"
            [style.font-size.rem]="1"
          />
          Габариты
        </span>
        @if (widthInput.focused() || heightInput.focused() || lengthInput.focused()) {
          <app-limit-badge
            [value]="getAvailableDimension()"
            units="см."
            hintText="Доступно"
            size="s"
          />
        }
      </div>

      <div formGroupName="dimensions" class="grid grid-cols-3 gap-2">
        <div tuiLabel>
          <span class="text-xs text-gray-500 mb-1 inline-block">Ширина</span>
          <tui-textfield #widthInput class="w-full">
            <input
              tuiInputNumber
              [formControl]="width"
              [min]="limits.DIMENSIONS.MIN"
              [max]="getMaxDimension(width)"
              [tuiHint]="[] | tuiFieldErrorContent"
              [invalid]="dimensions.invalid || totalDimensionsMaxError"
              (blur)="setMinDimensionOnBlur(width.value, 'width')"
              tuiHintAppearance="error"
              postfix=" см"
            />
          </tui-textfield>
        </div>

        <div tuiLabel>
          <span class="text-xs text-gray-500 mb-1 inline-block">Высота</span>
          <tui-textfield #heightInput class="w-full">
            <input
              tuiInputNumber
              [formControl]="height"
              [min]="limits.DIMENSIONS.MIN"
              [max]="getMaxDimension(height)"
              [tuiHint]="[] | tuiFieldErrorContent"
              [invalid]="dimensions.invalid || totalDimensionsMaxError"
              (blur)="setMinDimensionOnBlur(height.value, 'height')"
              tuiHintAppearance="error"
              postfix=" см"
            />
          </tui-textfield>
        </div>

        <div tuiLabel>
          <span class="text-xs text-gray-500 mb-1 inline-block">Длина</span>
          <tui-textfield #lengthInput class="w-full">
            <input
              tuiInputNumber
              [formControl]="length"
              [min]="limits.DIMENSIONS.MIN"
              [max]="getMaxDimension(length)"
              [tuiHint]="[] | tuiFieldErrorContent"
              [invalid]="dimensions.invalid || totalDimensionsMaxError"
              (blur)="setMinDimensionOnBlur(length.value, 'length')"
              tuiHintAppearance="error"
              postfix=" см"
            />
          </tui-textfield>
        </div>
      </div>
    </div>
    <tui-error [formControl]="dimensionsError" [error]="[] | tuiFieldError | async" />
  </div>
</div>
